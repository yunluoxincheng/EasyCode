<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;padding:0;background:#0a0e0b}
.box{width:1024px;height:1024px;background:#0a0e0b;position:relative;
  display:flex;align-items:center;justify-content:center}
.ring{position:absolute;inset:26px;border:14px solid #1e2b21;border-radius:150px}
.glyph{font-family:Consolas,'Cascadia Code',monospace;font-size:620px;line-height:1;
  color:#4ade80;transform:translateY(-10px)}
.cursor{position:absolute;right:150px;bottom:130px;width:150px;height:56px;background:#4ade80;opacity:.85}
</style></head><body>
<div class="box"><div class="ring"></div><div class="glyph">▚</div><div class="cursor"></div></div>
</body></html>
