name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
          - platform: macos-latest
          - platform: ubuntu-22.04
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop-tauri/src-tauri


      - name: Setup macOS universal target
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Extract changelog for release body
        id: changelog
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" == v* ]]; then
            VER="${GITHUB_REF_NAME#v}"
            awk -v ver="$VER" '
              index($0, "## [" ver "]") == 1 { found=1; next }
              /^## \[/ && found { exit }
              found { print }
            ' CHANGELOG.md > release_body.md
          fi
          if [ ! -s release_body.md ]; then
            echo "EasyCode 桌面端安装包。Windows 下载 .exe / .msi，macOS 下载 .dmg / .app.tar.gz，Linux 下载 .AppImage / .deb。" > release_body.md
          fi
          {
            echo 'body<<CHANGELOG_BODY_EOF'
            cat release_body.md
            echo 'CHANGELOG_BODY_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build & release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'EasyCode v__VERSION__'
          releaseBody: ${{ steps.changelog.outputs.body }}
          releaseDraft: false
          prerelease: false
          projectPath: packages/desktop-tauri
          args: ${{ matrix.platform == 'macos-latest' && '--target universal-apple-darwin' || '' }}

